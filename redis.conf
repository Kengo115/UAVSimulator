# Redis configuration for UAV Simulator
# 基本設定
bind 0.0.0.0
port 6379
protected-mode no
timeout 0
tcp-keepalive 300

# メモリ設定
maxmemory 256mb
maxmemory-policy allkeys-lru

# 永続化設定（AOF）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 永続化設定（RDB）
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ログ設定
loglevel notice
logfile ""

# データベース設定
databases 16

# クライアント接続設定
maxclients 10000

# Slow logの設定
slowlog-log-slower-than 10000
slowlog-max-len 128

# イベント通知（Pub/Sub用）
notify-keyspace-events ""

# Lua スクリプト設定
lua-time-limit 5000
